<main class="profile-page">
  <p class="eyebrow">YOUR ACCOUNT</p>
  <h1>Your profile</h1>
  <p class="intro">Your account details for Bharat Companion.</p>

  <section class="profile-card" aria-labelledby="profile-name">
    <div class="profile-summary">
      <div class="profile-avatar" aria-hidden="true">{{ initials }}</div>
      <div>
        <h2 id="profile-name">{{ fullName }}</h2>
        <p>Customer</p>
      </div>
    </div>

    <dl class="profile-details">
      <div>
        <dt>Name</dt>
        <dd>{{ fullName }}</dd>
      </div>
      <div>
        <dt>Customer ID</dt>
        <dd>{{ customerId }}</dd>
      </div>
      <div>
        <dt>Email address</dt>
        <dd>{{ email }}</dd>
      </div>
      <div>
        <dt>Phone number</dt>
        <dd>{{ mobileNumber }}</dd>
      </div>
    </dl>
  </section>
</main>
