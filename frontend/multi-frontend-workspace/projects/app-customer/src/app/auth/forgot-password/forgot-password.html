<div class="auth-page forgot-password-page">
  <section class="auth-card" aria-labelledby="forgot-password-title">
    <img
      class="company-logo"
      src="/assets/bharat-companion-logo.svg"
      alt="Bharat Companion"
    />

    <div class="auth-heading">
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1 id="forgot-password-title">Forgot your password?</h1>
      <p>Enter your email address and we’ll help you get back in.</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <label for="reset-email">Email address</label>
      <input
        id="reset-email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      />

      <button class="primary-button" type="submit">Continue</button>
    </form>

    @if (submitted) {
      <p class="form-message" role="status">
        Password reset is ready to be connected to the account recovery service.
      </p>
    }

    <p class="auth-footer"><a routerLink="/login">Back to log in</a></p>
  </section>
</div>
