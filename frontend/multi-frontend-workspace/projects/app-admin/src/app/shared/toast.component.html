<div class="toast-container" aria-live="polite" aria-label="Notifications">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast" [class.toast-success]="toast.type === 'success'" [class.toast-error]="toast.type === 'error'" [class.toast-info]="toast.type === 'info'" role="status">
      <span>{{ toast.message }}</span>
      <button type="button" aria-label="Dismiss notification" (click)="toastService.dismiss(toast.id)">×</button>
    </div>
  }
</div>
