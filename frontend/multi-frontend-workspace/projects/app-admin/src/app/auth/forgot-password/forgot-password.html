<main class="login-page">
  <section class="login-card" aria-label="Forgot password">
    <aside class="brand-panel">
      <img
        class="company-logo"
        src="/assets/bharat-companion-logo.svg"
        alt="Bharat Companion"
      />

      <div class="brand-content">
        <svg class="shield-icon" viewBox="0 0 160 180" aria-hidden="true">
          <path
            class="shield-outline"
            d="M80 9 145 35v43c0 43-25 73-65 93C40 151 15 121 15 78V35L80 9Z"
          />
          <circle class="shield-line" cx="80" cy="68" r="24" />
          <path class="shield-line" d="M45 125c5-29 18-43 35-43s30 14 35 43" />
        </svg>
        <h2>Secure Administration</h2>
      </div>
    </aside>

    <div class="form-panel">
      <div class="admin-badge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20a8 8 0 0 1 16 0" />
        </svg>
        <span>ADMIN PORTAL</span>
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
        <h1>Forgot password</h1>

        <div class="field-group">
          <label for="forgot-email">Email</label>
          <input
            id="forgot-email"
            formControlName="email"
            type="email"
            autocomplete="email"
            placeholder="admin@example.com"
          />
        </div>

        <button class="submit-button" type="submit">Continue</button>

        <p class="access-note">
          <a routerLink="/login">Back to log in</a>
        </p>
      </form>
    </div>
  </section>
</main>
