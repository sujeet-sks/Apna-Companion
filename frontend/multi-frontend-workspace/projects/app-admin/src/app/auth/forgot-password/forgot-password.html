<main class="login-page">
  <section class="login-card" aria-label="Forgot password">
    <aside class="brand-panel">
      <img
        class="company-logo"
        src="/assets/bharat-companion-logo.svg"
        alt="Bharat Companion"
      />

      <div class="brand-content">
        <svg class="shield-icon" viewBox="0 0 160 180" aria-hidden="true">
          <path
            class="shield-outline"
            d="M80 9 145 35v43c0 43-25 73-65 93C40 151 15 121 15 78V35L80 9Z"
          />
          <circle class="shield-line" cx="80" cy="68" r="24" />
          <path class="shield-line" d="M45 125c5-29 18-43 35-43s30 14 35 43" />
        </svg>
      </div>
    </aside>

    <div class="form-panel">
      <div class="admin-badge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20a8 8 0 0 1 16 0" />
        </svg>
        <span>ADMIN PORTAL</span>
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
        <h1>Forgot password</h1>

        <div class="field-group">
          <label for="forgot-email">Email</label>
          <input
            id="forgot-email"
            formControlName="email"
            type="email"
            autocomplete="email"
            placeholder="admin@example.com"
            [readonly]="otpStage"
          />
        </div>

        @if (otpStage) {
          <div class="field-group">
            <label for="forgot-otp">6-digit OTP</label>
            <input
              id="forgot-otp"
              formControlName="otp"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              pattern="[0-9]{6}"
              placeholder="Enter OTP"
            />
          </div>

          <div class="field-group">
            <label for="new-password">New password</label>
            <input
              id="new-password"
              formControlName="newPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Enter new password"
            />
          </div>

          <div class="field-group">
            <label for="confirm-password">Confirm password</label>
            <input
              id="confirm-password"
              formControlName="confirmPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Confirm new password"
            />
          </div>

          @if (forgotPasswordForm.hasError('passwordsMismatch') && forgotPasswordForm.controls.confirmPassword.touched) {
            <small class="field-error">Passwords do not match.</small>
          }
        }

        <button
          class="submit-button"
          type="submit"
          [disabled]="isSubmitting || (!otpStage
            ? forgotPasswordForm.controls.email.invalid
            : forgotPasswordForm.controls.otp.invalid ||
              forgotPasswordForm.controls.newPassword.invalid ||
              forgotPasswordForm.controls.confirmPassword.invalid ||
              forgotPasswordForm.hasError('passwordsMismatch'))"
        >
          {{ isSubmitting ? 'Please wait...' : (otpStage ? 'Submit OTP' : 'Continue') }}
        </button>

        @if (errorMessage) {
          <p class="access-note login-error" role="alert">{{ errorMessage }}</p>
        }
        @if (successMessage) {
          <p class="access-note" role="status">{{ successMessage }}</p>
        }

        <p class="access-note">
          <a routerLink="/login">Back to log in</a>
        </p>
      </form>
    </div>
  </section>
</main>
