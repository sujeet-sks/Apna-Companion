<main class="settings-page">
  <section class="settings-card">
    <h1>Admin Settings</h1>

    <form [formGroup]="profileForm" (ngSubmit)="updateProfile()">
      <h2>Profile</h2>
      <label for="full-name">Full name</label>
      <input
        id="full-name"
        formControlName="full_name"
        type="text"
        autocomplete="name"
      />

      <label for="profile-email">Email</label>
      <input
        id="profile-email"
        formControlName="EmailId"
        type="email"
        autocomplete="email"
      />

      <button type="submit" [disabled]="profileForm.invalid || isProfileSubmitting">
        {{ isProfileSubmitting ? 'Saving...' : 'Update profile' }}
      </button>

      @if (profileMessage) {
        <p role="status">{{ profileMessage }}</p>
      }
    </form>

    <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
      <h2>Change password</h2>

      <label for="current-password">Current password</label>
      <input
        id="current-password"
        formControlName="currentPassword"
        type="password"
        autocomplete="current-password"
      />

      <label for="new-password">New password</label>
      <input
        id="new-password"
        formControlName="newPassword"
        type="password"
        autocomplete="new-password"
      />

      <label for="confirm-password">Confirm new password</label>
      <input
        id="confirm-password"
        formControlName="confirmPassword"
        type="password"
        autocomplete="new-password"
      />

      @if (passwordForm.hasError('passwordsMismatch') && passwordForm.controls.confirmPassword.touched) {
        <small>Passwords do not match.</small>
      }

      <button type="submit" [disabled]="passwordForm.invalid || isPasswordSubmitting">
        {{ isPasswordSubmitting ? 'Changing...' : 'Change password' }}
      </button>

      @if (passwordMessage) {
        <p role="status">{{ passwordMessage }}</p>
      }
    </form>
  </section>
</main>
