<aside class="sidebar">
  <a class="brand" [routerLink]="dashboardPath">
    <span class="mark">a<span>c</span></span>
    <span>apna companion</span>
  </a>

  <p class="nav-caption">ORGANIZATION</p>
  <nav aria-label="Organization navigation">
    <a [routerLink]="dashboardPath" [class.active]="active === 'dashboard'"> Dashboard </a>
    <a [routerLink]="dashboardPath" fragment="bookings" [class.active]="active === 'bookings'">
      Bookings
    </a>
    <a [routerLink]="companionsPath" [class.active]="active === 'companions'"> Companions </a>
    <a [routerLink]="servicesPath" [class.active]="active === 'services'"> Services </a>
    <a [routerLink]="profilePath" [class.active]="active === 'profile'"> Organization profile </a>
    @if (!preview) {
      <a routerLink="/change-password"> Change password </a>
    }
  </nav>

  @if (preview) {
    <div class="preview-note">Preview mode · sample data</div>
  }
</aside>
