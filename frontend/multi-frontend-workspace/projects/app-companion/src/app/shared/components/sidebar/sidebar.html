<aside class="sidebar">
  <a class="brand" [routerLink]="dashboardPath">
    <span class="mark">a<span>c</span></span>
    <span>apna companion</span>
  </a>

  <p class="nav-caption">COMPANION PORTAL</p>
  <nav aria-label="Companion navigation">
    <a [routerLink]="dashboardPath" [class.active]="active === 'dashboard'"> Dashboard </a>
    <a [routerLink]="dashboardPath" fragment="journeys" [class.active]="active === 'journeys'">

    </a>
    <a [routerLink]="profilePath" [class.active]="active === 'profile'"> My profile </a>

    }

  @if (preview) {
    <div class="preview-note">Preview mode · sample data</div>
  }
